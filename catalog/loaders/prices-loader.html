<!--
  prices-loader.html

  Loader для блока цен на яхты (страница /ru/yachts и языковые варианты).
  Тянет catalog/blocks/prices.html из Profbroker/y-az-publish (jsDelivr CDN).

  Размещение: один T123 (Full Width) на странице каталога /ru/yachts (и en/az),
  заменяет существующий блок «5-prices» с встроенным кодом.

  После правки prices.html в репо:
    curl -X POST https://purge.jsdelivr.net/ -H "Content-Type: application/json" \
      -d '{"path":["/gh/Profbroker/y-az-publish@main/catalog/blocks/prices.html"]}'
-->

<div id="yp-prices-mount" style="min-height:400px;">
  <div style="text-align:center;padding:80px 24px;color:#7A8294;font:14px Inter,sans-serif">
    Загрузка цен…
  </div>
</div>

<script>
(function () {
  var CDN_URL = 'https://rawcdn.githack.com/Profbroker/y-az-publish/main/catalog/blocks/prices.html';
  var TIMEOUT = 6000;

  var mount = document.getElementById('yp-prices-mount');
  if (!mount) return;

  var ctrl  = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, TIMEOUT);

  fetch(CDN_URL, { signal: ctrl.signal, cache: 'no-store' })
    .then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (html) {
      mount.innerHTML = html;
      mount.querySelectorAll('script').forEach(function (old) {
        var s = document.createElement('script');
        for (var i = 0; i < old.attributes.length; i++) {
          s.setAttribute(old.attributes[i].name, old.attributes[i].value);
        }
        s.textContent = old.textContent;
        old.parentNode.replaceChild(s, old);
      });
    })
    .catch(function (err) {
      console.error('[prices] loader failed:', err);
      mount.innerHTML =
        '<div style="text-align:center;padding:48px 24px;font:14px Inter,sans-serif;color:#7A8294">' +
          'Не удалось загрузить цены. Свяжитесь с нами в WhatsApp +994 50 235 02 35' +
        '</div>';
    });
})();
</script>
