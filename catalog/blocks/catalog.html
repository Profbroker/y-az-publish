<!-- ОРИГИНАЛЬНОЕ ОПИСАНИЕ:
  Что нового (09.05.2026): полный рестайл по CATALOG-RESTYLE.md
  (sharp corners, чёрный type-badge, текстовые spec-метрики без
  иконок, eyebrow «от» в цене, paper-фон секции с hairline-границами,
  3-колоночная сетка на широких экранах). Header секции с pill+H2+lead
  УБРАН по запросу заказчика — заголовок страницы живёт отдельным
  Tilda-блоком выше (не дублируется здесь). Логика, данные из CSV,
  маршрутизация, бронирование, slug pre-fill — НЕ ТРОНУТЫ.
-->

<section id="yz-cat" data-yz-cat-version="2026-05-09-noheader">
  <div id="yz-cat-inner">
    <div id="yz-cat-grid"></div>
  </div>
</section>

<style>
/* ── tokens (общие с hero и weather) ─────────────────────────── */
#yz-cat {
  --ink:        #0E1726;
  --ink-soft:   #3A4456;
  --ink-muted:  #7A8294;
  --rule:       #E8E5DD;
  --paper:      #FBFAF6;
  --white:      #FFFFFF;
  --navy:       #0E375E;

  background: var(--paper);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 64px 0 96px;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--ink);
}

#yz-cat, #yz-cat * { box-sizing: border-box; }
#yz-cat a { text-decoration: none; }

#yz-cat-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 48px;
}

/* ── grid ───────────────────────────────────────────────────── */
#yz-cat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

/* ── card ───────────────────────────────────────────────────── */
.yz-card {
  background: var(--white);
  border: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  color: inherit;
}

/* ── photo ──────────────────────────────────────────────────── */
.yz-card-photo-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: var(--paper);
  flex-shrink: 0;
}

.yz-card-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.yz-card-type-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  padding: 5px 10px;
  background: var(--ink);
  color: var(--white);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.6px;
  text-transform: uppercase;
}

/* ── body ───────────────────────────────────────────────────── */
.yz-card-body {
  padding: 20px 20px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.yz-card-name {
  margin: 0;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.6px;
  color: var(--ink);
  line-height: 1.15;
}

.yz-card-shipyard {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.1px;
  color: var(--ink-muted);
}

.yz-card-desc {
  margin: 4px 0 0;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.55;
  color: var(--ink-soft);
}

/* ── spec row (text only, no icons) ─────────────────────────── */
.yz-card-specs {
  margin: 20px 20px 0;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
  display: flex;
  gap: 24px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.2px;
  color: var(--ink-soft);
}

.yz-spec-label {
  color: var(--ink-muted);
  margin-right: 6px;
}

.yz-spec-value {
  font-weight: 600;
  color: var(--ink);
}

/* ── price + CTAs ───────────────────────────────────────────── */
.yz-card-foot {
  padding: 20px;
  margin-top: auto;
}

.yz-price {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 14px;
}

.yz-price-from {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.yz-price-value {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.4px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.yz-price-unit {
  font-size: 13px;
  font-weight: 400;
  color: var(--ink-muted);
}

.yz-card-btns {
  display: flex;
  gap: 8px;
}

/* префикс #yz-cat нужен чтобы перебить Tilda site-color
   (Настройки → Цвета и стили → Цвет ссылок), который красит все
   <a> в brand-color с специфичностью 0,1,1 — выше чем у нашего
   .yz-btn-book (0,1,0). */
#yz-cat .yz-btn-book,
#yz-cat .yz-btn-more {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 13px 16px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  border-radius: 0;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
}

#yz-cat .yz-btn-book {
  background: var(--ink);
  color: var(--white);
  border: 1px solid var(--ink);
}

#yz-cat .yz-btn-book:hover {
  background: #000;
  color: var(--white);
}

#yz-cat .yz-btn-more {
  background: var(--white);
  color: var(--ink);
  border: 1px solid var(--ink);
}

#yz-cat .yz-btn-more:hover {
  background: var(--ink);
  color: var(--white);
}

/* ── responsive ─────────────────────────────────────────────── */
@media (max-width: 1279px) {
  #yz-cat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 1023px) {
  #yz-cat-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  #yz-cat {
    padding: 48px 0 64px;
  }
  #yz-cat-inner {
    padding: 0 24px;
  }
  .yz-card-btns {
    flex-direction: column;
  }
}

/* ── loader ─────────────────────────────────────────────────── */
.yz-cat-loader {
  grid-column: 1 / -1;
  text-align: center;
  padding: 48px;
  color: var(--ink-muted);
  font-size: 14px;
}

/* ── price-anchor: 3 пресета в карточке (паттерн со страницы яхты, компактно) ── */
.yz-card .yz-price-slot { width: 100%; }
.yz-pa { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.yz-pa-eyebrow {
  width: 100%; margin-bottom: 4px;
  font-size: 9px; font-weight: 500; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--ink-muted);
}
.yz-pa-card { display: flex; flex-direction: column; align-items: flex-start; }
.yz-pa-h {
  font-size: 10px; font-weight: 500; letter-spacing: 0.6px;
  text-transform: uppercase; color: var(--ink-muted);
}
.yz-pa-total {
  font-size: 16px; font-weight: 600; letter-spacing: -0.3px;
  color: var(--ink); margin-top: 3px; font-variant-numeric: tabular-nums;
}
.yz-pa-rate {
  font-size: 10px; color: var(--ink-muted); margin-top: 1px;
  font-variant-numeric: tabular-nums;
}
</style>

<script>
(function () {
  var CSV_URL          = 'https://raw.githubusercontent.com/Profbroker/y-az-publish/main/catalog/data/yachts.csv';
  var PRICES_CSV_URL   = 'https://raw.githubusercontent.com/Profbroker/y-az-publish/main/catalog/data/prices.csv';
  var SETTINGS_CSV_URL = 'https://raw.githubusercontent.com/Profbroker/y-az-publish/main/catalog/data/settings.csv';
  var SEASON_FB = { high_start: '01.05', high_end: '30.09' };

  var path = window.location.pathname;
  var lang = /\/en(\/|$)/.test(path) ? 'en' : /\/ru(\/|$)/.test(path) ? 'ru' : 'az';

  var T = {
    ru: {
      from:       'от',
      per_unit:   '/ час',
      currency:   '₼',
      lbl_guests: 'Гостей',
      lbl_length: 'Длина',
      more:       'Подробнее →',
      book:       'Забронировать',
      loading:    'Загрузка...',
      pa_eyebrow: 'Часто выбирают:',
      pa_h_one:   'час', pa_h_few: 'часа', pa_h_many: 'часов',
      pa_rate_unit: '₼/ч', pa_currency: '₼'
    },
    en: {
      from:       'from',
      per_unit:   '/ hour',
      currency:   '₼',
      lbl_guests: 'Guests',
      lbl_length: 'Length',
      more:       'Details →',
      book:       'Book Now',
      loading:    'Loading...',
      pa_eyebrow: 'Popular choices:',
      pa_h_one:   'hour', pa_h_few: 'hours', pa_h_many: 'hours',
      pa_rate_unit: '₼/h', pa_currency: '₼'
    },
    az: {
      from:       '-dan',
      per_unit:   '/ saat',
      currency:   '₼',
      lbl_guests: 'Qonaq',
      lbl_length: 'Uzunluq',
      more:       'Ətraflı →',
      book:       'Sifariş et',
      loading:    'Yüklənir...',
      pa_eyebrow: 'Tez-tez seçilir:',
      pa_h_one:   'saat', pa_h_few: 'saat', pa_h_many: 'saat',
      pa_rate_unit: '₼/saat', pa_currency: '₼'
    }
  };

  var t = T[lang];

  var grid = document.getElementById('yz-cat-grid');
  grid.innerHTML = '<div class="yz-cat-loader">' + t.loading + '</div>';

  /* ---------- CSV parser ---------- */
  function parseCSV(text) {
    var lines = text.split(/\r?\n/);
    var headers = parseLine(lines[0]);
    var rows = [];
    for (var i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      var vals = parseLine(lines[i]);
      var obj = {};
      headers.forEach(function (h, j) { obj[h.trim()] = (vals[j] || '').trim(); });
      rows.push(obj);
    }
    return rows;
  }

  function parseLine(line) {
    var result = [], cur = '', q = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') { q = !q; }
      else if (c === ',' && !q) { result.push(cur); cur = ''; }
      else { cur += c; }
    }
    result.push(cur);
    return result;
  }

  /* ---------- price-anchor helpers (паттерн со страницы яхты) ---------- */
  function hourLabel(n) {
    n = Math.abs(+n); var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return t.pa_h_one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return t.pa_h_few;
    return t.pa_h_many;
  }
  function fmtN(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function buildPriceAnchorHtml(items) {
    var html = '<div class="yz-price-slot"><div class="yz-pa">' +
               '<div class="yz-pa-eyebrow">' + t.pa_eyebrow + '</div>';
    items.forEach(function (it) {
      html += '<div class="yz-pa-card' + (it.popular ? ' is-popular' : '') + '">' +
                '<div class="yz-pa-h">' + it.h + ' ' + hourLabel(it.h) + '</div>' +
                '<div class="yz-pa-total">' + fmtN(it.total) + ' ' + t.pa_currency + '</div>' +
                '<div class="yz-pa-rate">' + fmtN(it.total / it.h) + ' ' + t.pa_rate_unit + '</div>' +
              '</div>';
    });
    return html + '</div></div>';
  }
  function detectSeason(s) {
    var hs = (s.season_high_start || SEASON_FB.high_start).split('.');
    var he = (s.season_high_end   || SEASON_FB.high_end  ).split('.');
    var sD = +hs[0]||1, sM = +hs[1]||5, eD = +he[0]||30, eM = +he[1]||9;
    var d = new Date(), mo = d.getMonth()+1, da = d.getDate();
    var aft = (mo>sM)||(mo===sM&&da>=sD), bef = (mo<eM)||(mo===eM&&da<=eD);
    return (aft && bef) ? 'high' : 'low';
  }
  function parseSettings(text) {
    var rows = parseCSV(text), s = {};
    rows.forEach(function (r) { var k = Object.keys(r); if (k.length < 2) return;
      var kk = (r[k[0]]||'').trim(), vv = (r[k[1]]||'').trim(); if (kk) s[kk] = vv; });
    return s;
  }
  /* Пресеты для одной яхты: строка prices по slug+сезону, total = h1..hN + fee */
  function presetItems(yacht, pricesRows, season) {
    var lo = +yacht.pa_low_h||0, mid = +yacht.pa_mid_h||0, hi = +yacht.pa_high_h||0;
    if (!lo || !mid || !hi || !pricesRows) return null;
    var slugLower = String(yacht.slug||'').toLowerCase();
    var prio = {}; prio[season]=1; prio['any']=2; prio['']=2; prio[season==='high'?'low':'high']=3;
    var picked = null;
    for (var i=0;i<pricesRows.length;i++){ var r=pricesRows[i];
      if (String(r.slug||'').toLowerCase()!==slugLower) continue;
      var rs=(r.season||'any').toLowerCase();
      if (!picked || prio[rs] < prio[(picked.season||'any').toLowerCase()]) picked=r;
    }
    if (!picked) return null;
    var fee = +picked['fee']||0;
    function calcTotal(hours){ var sum=0; for(var i=1;i<=hours;i++){var rr=+picked['h'+i]; if(!rr) return 0; sum+=rr;} return sum+fee; }
    var a=calcTotal(lo), b=calcTotal(mid), c=calcTotal(hi);
    if (!a || !b || !c) return null;
    var items=[{h:lo,total:a},{h:mid,total:b,popular:true},{h:hi,total:c}];
    items.sort(function(x,y){return x.h-y.h;});
    return items;
  }

  /* ---------- render ---------- */
  function render(yachts, pricesRows, season) {
    var active = yachts.filter(function (y) { return y.active === 'yes'; });
    if (!active.length) { grid.innerHTML = ''; return; }

    var html = '';
    active.forEach(function (y) {
      var name      = esc(y.name || '');
      var slug      = y.slug || '';
      var type      = esc(y['type_' + lang] || '');
      var shipyard  = esc(y.shipyard || '');
      var model     = esc(y.model || '');
      var descShort = esc(y['desc_short_' + lang] || '');
      var photo     = esc(y.photo_main || '');
      var guests    = esc(y.guests || '');
      var length    = esc(y.length || '');
      var priceFrom = esc(y.price_from || '');
      var link      = esc(y['url_' + lang] || ('/' + lang + '/' + slug));

      html += '<article class="yz-card">';

      /* photo + type badge */
      html += '<a href="' + link + '" class="yz-card-photo-wrap" tabindex="-1" aria-hidden="true">';
      if (photo) {
        html += '<img class="yz-card-photo" src="' + photo + '" alt="' + name + '" loading="lazy">';
      }
      if (type) {
        html += '<span class="yz-card-type-badge">' + type + '</span>';
      }
      html += '</a>';

      /* body: name, shipyard·model, description */
      html += '<div class="yz-card-body">';
      html += '<h3 class="yz-card-name">' + name + '</h3>';
      if (shipyard || model) {
        html += '<div class="yz-card-shipyard">' + [shipyard, model].filter(Boolean).join(' · ') + '</div>';
      }
      if (descShort) {
        html += '<p class="yz-card-desc">' + descShort + '</p>';
      }
      html += '</div>';

      /* spec row (text only) */
      if (guests || length) {
        html += '<div class="yz-card-specs">';
        if (guests) {
          html += '<span><span class="yz-spec-label">' + t.lbl_guests + '</span>' +
                  '<span class="yz-spec-value">' + guests + '</span></span>';
        }
        if (length) {
          html += '<span><span class="yz-spec-label">' + t.lbl_length + '</span>' +
                  '<span class="yz-spec-value">' + length + '</span></span>';
        }
        html += '</div>';
      }

      /* price + CTAs — пресеты (как на странице яхты), фолбэк на «от X ₼/час» */
      html += '<div class="yz-card-foot">';
      var paItems = presetItems(y, pricesRows, season);
      if (paItems) {
        html += buildPriceAnchorHtml(paItems);
      } else if (priceFrom) {
        html += '<div class="yz-price">' +
                  '<span class="yz-price-from">' + t.from + '</span>' +
                  '<span class="yz-price-value">' + priceFrom + ' ' + t.currency + '</span>' +
                  '<span class="yz-price-unit">' + t.per_unit + '</span>' +
                '</div>';
      }
      html += '<div class="yz-card-btns">';
      html += '<a class="yz-btn-book" href="#popup:myform" data-slug="' + esc(slug) + '">' + t.book + '</a>';
      html += '<a class="yz-btn-more" href="' + link + '">' + t.more + '</a>';
      html += '</div>';
      html += '</div>';

      html += '</article>';
    });

    grid.innerHTML = html;

    /* При клике «Забронировать» из карточки — подставляем slug яхты
       в text-input «Yacht» формы myform. Иначе менеджер не знает
       какую яхту хотел клиент, приходится переспрашивать. */
    grid.querySelectorAll('.yz-btn-book').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var s = btn.dataset.slug;
        if (!s) return;
        /* небольшая задержка чтобы Tilda успела открыть попап и отрендерить input */
        setTimeout(function () {
          var inp = document.querySelector('input[name="Yacht"]');
          if (!inp) return;
          inp.value = s;
          inp.dispatchEvent(new Event('input',  { bubbles: true }));
          inp.dispatchEvent(new Event('change', { bubbles: true }));
        }, 400);
      });
    });
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ---------- fetch: яхты + цены + настройки параллельно ---------- */
  var bust = '?_=' + Date.now();
  var yachtsP   = fetch(CSV_URL + bust,        { cache: 'no-store' }).then(function (r) { return r.text(); });
  var pricesP   = fetch(PRICES_CSV_URL + bust, { cache: 'no-store' }).then(function (r) { return r.text(); }).catch(function () { return ''; });
  var settingsP = fetch(SETTINGS_CSV_URL + bust,{ cache: 'no-store' }).then(function (r) { return r.text(); }).catch(function () { return ''; });

  Promise.all([yachtsP, pricesP, settingsP])
    .then(function (res) {
      var yachts     = parseCSV(res[0]);
      var pricesRows = res[1] ? parseCSV(res[1]) : null;
      var settings   = res[2] ? parseSettings(res[2]) : {};
      var season     = detectSeason(settings);
      render(yachts, pricesRows, season);
    })
    .catch(function () { grid.innerHTML = ''; });
})();
</script>
