<!-- ОРИГИНАЛЬНОЕ ОПИСАНИЕ:
  Что нового (09.05.2026): полный рестайл по CATALOG-RESTYLE.md
  (sharp corners, чёрный type-badge, текстовые spec-метрики без
  иконок, eyebrow «от» в цене, paper-фон секции с hairline-границами,
  3-колоночная сетка на широких экранах). Header секции с pill+H2+lead
  УБРАН по запросу заказчика — заголовок страницы живёт отдельным
  Tilda-блоком выше (не дублируется здесь). Логика, данные из CSV,
  маршрутизация, бронирование, slug pre-fill — НЕ ТРОНУТЫ.
-->

<section id="yz-cat" data-yz-cat-version="2026-05-09-noheader">
  <div id="yz-cat-inner">
    <div id="yz-cat-grid"></div>
  </div>
</section>

<style>
/* ── tokens (общие с hero и weather) ─────────────────────────── */
#yz-cat {
  --ink:        #0E1726;
  --ink-soft:   #3A4456;
  --ink-muted:  #7A8294;
  --rule:       #E8E5DD;
  --paper:      #FBFAF6;
  --white:      #FFFFFF;
  --navy:       #0E375E;

  background: var(--paper);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 64px 0 96px;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--ink);
}

#yz-cat, #yz-cat * { box-sizing: border-box; }
#yz-cat a { text-decoration: none; }

#yz-cat-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 48px;
}

/* ── grid ───────────────────────────────────────────────────── */
#yz-cat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

/* ── card ───────────────────────────────────────────────────── */
.yz-card {
  background: var(--white);
  border: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  color: inherit;
}

/* ── photo ──────────────────────────────────────────────────── */
.yz-card-photo-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: var(--paper);
  flex-shrink: 0;
}

.yz-card-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.yz-card-type-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  padding: 5px 10px;
  background: var(--ink);
  color: var(--white);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.6px;
  text-transform: uppercase;
}

/* ── body ───────────────────────────────────────────────────── */
.yz-card-body {
  padding: 20px 20px 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.yz-card-name {
  margin: 0;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.6px;
  color: var(--ink);
  line-height: 1.15;
}

.yz-card-shipyard {
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.1px;
  color: var(--ink-muted);
}

.yz-card-desc {
  margin: 4px 0 0;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.55;
  color: var(--ink-soft);
}

/* ── spec row (text only, no icons) ─────────────────────────── */
.yz-card-specs {
  margin: 20px 20px 0;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
  display: flex;
  gap: 24px;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.2px;
  color: var(--ink-soft);
}

.yz-spec-label {
  color: var(--ink-muted);
  margin-right: 6px;
}

.yz-spec-value {
  font-weight: 600;
  color: var(--ink);
}

/* ── price + CTAs ───────────────────────────────────────────── */
.yz-card-foot {
  padding: 20px;
  margin-top: auto;
}

.yz-price {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 14px;
}

.yz-price-from {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--ink-muted);
}

.yz-price-value {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.4px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.yz-price-unit {
  font-size: 13px;
  font-weight: 400;
  color: var(--ink-muted);
}

.yz-card-btns {
  display: flex;
  gap: 8px;
}

/* префикс #yz-cat нужен чтобы перебить Tilda site-color
   (Настройки → Цвета и стили → Цвет ссылок), который красит все
   <a> в brand-color с специфичностью 0,1,1 — выше чем у нашего
   .yz-btn-book (0,1,0). */
#yz-cat .yz-btn-book,
#yz-cat .yz-btn-more {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 13px 16px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  border-radius: 0;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
}

#yz-cat .yz-btn-book {
  background: var(--ink);
  color: var(--white);
  border: 1px solid var(--ink);
}

#yz-cat .yz-btn-book:hover {
  background: #000;
  color: var(--white);
}

#yz-cat .yz-btn-more {
  background: var(--white);
  color: var(--ink);
  border: 1px solid var(--ink);
}

#yz-cat .yz-btn-more:hover {
  background: var(--ink);
  color: var(--white);
}

/* ── responsive ─────────────────────────────────────────────── */
@media (max-width: 1279px) {
  #yz-cat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 1023px) {
  #yz-cat-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  #yz-cat {
    padding: 48px 0 64px;
  }
  #yz-cat-inner {
    padding: 0 24px;
  }
  .yz-card-btns {
    flex-direction: column;
  }
}

/* ── loader ─────────────────────────────────────────────────── */
.yz-cat-loader {
  grid-column: 1 / -1;
  text-align: center;
  padding: 48px;
  color: var(--ink-muted);
  font-size: 14px;
}
</style>

<script>
(function () {
  var CSV_URL = 'https://raw.githubusercontent.com/Profbroker/y-az-publish/main/catalog/data/yachts.csv';

  var path = window.location.pathname;
  var lang = /\/en(\/|$)/.test(path) ? 'en' : /\/ru(\/|$)/.test(path) ? 'ru' : 'az';

  var T = {
    ru: {
      from:       'от',
      per_unit:   '/ час',
      currency:   '₼',
      lbl_guests: 'Гостей',
      lbl_length: 'Длина',
      more:       'Подробнее →',
      book:       'Забронировать',
      loading:    'Загрузка...'
    },
    en: {
      from:       'from',
      per_unit:   '/ hour',
      currency:   '₼',
      lbl_guests: 'Guests',
      lbl_length: 'Length',
      more:       'Details →',
      book:       'Book Now',
      loading:    'Loading...'
    },
    az: {
      from:       '-dan',
      per_unit:   '/ saat',
      currency:   '₼',
      lbl_guests: 'Qonaq',
      lbl_length: 'Uzunluq',
      more:       'Ətraflı →',
      book:       'Sifariş et',
      loading:    'Yüklənir...'
    }
  };

  var t = T[lang];

  var grid = document.getElementById('yz-cat-grid');
  grid.innerHTML = '<div class="yz-cat-loader">' + t.loading + '</div>';

  /* ---------- CSV parser ---------- */
  function parseCSV(text) {
    var lines = text.split(/\r?\n/);
    var headers = parseLine(lines[0]);
    var rows = [];
    for (var i = 1; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      var vals = parseLine(lines[i]);
      var obj = {};
      headers.forEach(function (h, j) { obj[h.trim()] = (vals[j] || '').trim(); });
      rows.push(obj);
    }
    return rows;
  }

  function parseLine(line) {
    var result = [], cur = '', q = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') { q = !q; }
      else if (c === ',' && !q) { result.push(cur); cur = ''; }
      else { cur += c; }
    }
    result.push(cur);
    return result;
  }

  /* ---------- render ---------- */
  function render(yachts) {
    var active = yachts.filter(function (y) { return y.active === 'yes'; });
    if (!active.length) { grid.innerHTML = ''; return; }

    var html = '';
    active.forEach(function (y) {
      var name      = esc(y.name || '');
      var slug      = y.slug || '';
      var type      = esc(y['type_' + lang] || '');
      var shipyard  = esc(y.shipyard || '');
      var model     = esc(y.model || '');
      var descShort = esc(y['desc_short_' + lang] || '');
      var photo     = esc(y.photo_main || '');
      var guests    = esc(y.guests || '');
      var length    = esc(y.length || '');
      var priceFrom = esc(y.price_from || '');
      var link      = esc(y['url_' + lang] || ('/' + lang + '/' + slug));

      html += '<article class="yz-card">';

      /* photo + type badge */
      html += '<a href="' + link + '" class="yz-card-photo-wrap" tabindex="-1" aria-hidden="true">';
      if (photo) {
        html += '<img class="yz-card-photo" src="' + photo + '" alt="' + name + '" loading="lazy">';
      }
      if (type) {
        html += '<span class="yz-card-type-badge">' + type + '</span>';
      }
      html += '</a>';

      /* body: name, shipyard·model, description */
      html += '<div class="yz-card-body">';
      html += '<h3 class="yz-card-name">' + name + '</h3>';
      if (shipyard || model) {
        html += '<div class="yz-card-shipyard">' + [shipyard, model].filter(Boolean).join(' · ') + '</div>';
      }
      if (descShort) {
        html += '<p class="yz-card-desc">' + descShort + '</p>';
      }
      html += '</div>';

      /* spec row (text only) */
      if (guests || length) {
        html += '<div class="yz-card-specs">';
        if (guests) {
          html += '<span><span class="yz-spec-label">' + t.lbl_guests + '</span>' +
                  '<span class="yz-spec-value">' + guests + '</span></span>';
        }
        if (length) {
          html += '<span><span class="yz-spec-label">' + t.lbl_length + '</span>' +
                  '<span class="yz-spec-value">' + length + '</span></span>';
        }
        html += '</div>';
      }

      /* price + CTAs */
      html += '<div class="yz-card-foot">';
      if (priceFrom) {
        html += '<div class="yz-price">' +
                  '<span class="yz-price-from">' + t.from + '</span>' +
                  '<span class="yz-price-value">' + priceFrom + ' ' + t.currency + '</span>' +
                  '<span class="yz-price-unit">' + t.per_unit + '</span>' +
                '</div>';
      }
      html += '<div class="yz-card-btns">';
      html += '<a class="yz-btn-book" href="#popup:myform" data-slug="' + esc(slug) + '">' + t.book + '</a>';
      html += '<a class="yz-btn-more" href="' + link + '">' + t.more + '</a>';
      html += '</div>';
      html += '</div>';

      html += '</article>';
    });

    grid.innerHTML = html;

    /* При клике «Забронировать» из карточки — подставляем slug яхты
       в text-input «Yacht» формы myform. Иначе менеджер не знает
       какую яхту хотел клиент, приходится переспрашивать. */
    grid.querySelectorAll('.yz-btn-book').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var s = btn.dataset.slug;
        if (!s) return;
        /* небольшая задержка чтобы Tilda успела открыть попап и отрендерить input */
        setTimeout(function () {
          var inp = document.querySelector('input[name="Yacht"]');
          if (!inp) return;
          inp.value = s;
          inp.dispatchEvent(new Event('input',  { bubbles: true }));
          inp.dispatchEvent(new Event('change', { bubbles: true }));
        }, 400);
      });
    });
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ---------- fetch ---------- */
  fetch(CSV_URL + '?_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (text) { render(parseCSV(text)); })
    .catch(function () { grid.innerHTML = ''; });
})();
</script>
